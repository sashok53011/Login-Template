<!DOCTYPE html>
<html lang="ru" data-theme="day">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>DevHorizon — app.devhorizon.online</title>
    <script>
      /* Apply the saved language and theme before the first paint, so a night
         theme never flashes a white page. Mirrors the logic in /ui.js. */
      (function () {
        var LANGS = ["ru", "en", "de"];
        var THEMES = [
          "day",
          "day-yellow",
          "day-red",
          "day-green",
          "day-orange",
          "night-red",
          "night-blue",
          "night-yellow",
          "night-green",
          "night-orange",
        ];
        var root = document.documentElement;
        var lang = null;
        var theme = null;
        try {
          lang = localStorage.getItem("ui_lang");
        } catch (e) {}
        try {
          theme = localStorage.getItem("ui_theme");
        } catch (e) {}
        if (LANGS.indexOf(lang) < 0) {
          var nav = String(navigator.language || "").slice(0, 2).toLowerCase();
          lang = LANGS.indexOf(nav) >= 0 ? nav : "ru";
        }
        if (THEMES.indexOf(theme) < 0) {
          theme = "day";
        }
        root.setAttribute("lang", lang);
        root.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="/styles.css?v=2" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">DH</span>
          <div>
            <h1>DevHorizon</h1>
            <p class="muted" id="host-label">app.devhorizon.online</p>
          </div>
        </div>
        <div class="topbar-right">
          <div class="ui-controls" id="ui-controls">
            <label class="ui-field">
              <span id="ui-lang-label">Язык</span>
              <select id="ui-lang"></select>
            </label>
            <label class="ui-field">
              <span id="ui-theme-label">Тема</span>
              <select id="ui-theme"></select>
            </label>
          </div>
          <div class="topbar-actions" id="topbar-actions" hidden>
            <span class="who" id="who"></span>
            <button
              class="btn btn-ghost"
              id="logout-btn"
              type="button"
              data-i18n="logout"
            >
              Выйти
            </button>
          </div>
        </div>
      </header>

      <main>
        <!-- ---------------------------------------------------- login view -->
        <section id="auth-view" class="card auth-card" hidden>
          <h2 class="card-title" data-i18n="loginTitle">Вход</h2>

          <form id="login-form" class="form">
            <label>
              <span data-i18n="email">Email</span>
              <input
                type="email"
                name="identity"
                autocomplete="username"
                required
              />
            </label>
            <label>
              <span data-i18n="password">Пароль</span>
              <input
                type="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </label>
            <label class="row">
              <span data-i18n="adminLogin"
                >Вход администратора (superuser)</span
              >
              <input type="checkbox" id="admin-login" />
            </label>
            <button class="btn btn-primary" type="submit" data-i18n="submit">
              Войти
            </button>
          </form>

          <p class="note" id="auth-note" hidden></p>
          <p class="note">
            <span data-i18n="noAccount">Ещё нет аккаунта?</span>
            <a href="/ai-providers/" data-i18n="register">Зарегистрироваться</a>
          </p>
        </section>

        <!-- ----------------------------------------------------- menu view -->
        <section id="menu-view" hidden>
          <div class="card">
            <h2 class="card-title" id="greeting" data-i18n="greeting">
              Здравствуйте!
            </h2>
            <p class="note" id="role-note"></p>

            <div class="menu">
              <a class="btn btn-primary menu-btn" href="/ai-providers/">
                AI Providers
              </a>
              <a
                class="btn btn-ghost menu-btn"
                id="admin-btn"
                href="/_/"
                hidden
                data-i18n="adminBtn"
              >
                Панель администратора
              </a>
              <button
                class="btn btn-ghost menu-btn"
                id="api-btn"
                type="button"
                hidden
                data-i18n="apiBtn"
              >
                Проверить API
              </button>
            </div>

            <pre class="api-out" id="api-out" hidden></pre>
          </div>
        </section>

        <p class="error" id="error-note" hidden></p>
      </main>

      <footer class="footer muted">
        <span>app.devhorizon.online</span>
        <span>·</span>
        <a href="/ai-providers/">AI Providers</a>
      </footer>
    </div>

    <script src="/ui.js?v=1"></script>
    <script>
      /* Landing page for app.devhorizon.online.
       *
       * Shares the session with /ai-providers/ through the same localStorage
       * keys, so signing in here also signs you in there.
       *
       * The administrator buttons are only rendered for a PocketBase
       * superuser, which is what /api/ai-config/meta reports as isSuperuser.
       *
       * Copy is localised through STR / t(); the language and theme switchers
       * come from /ui.js.
       */

      var TOKEN_KEY = "ai_token";
      var USER_KEY = "ai_user";

      var STR = {
        ru: {
          logout: "Выйти",
          loginTitle: "Вход",
          email: "Email",
          password: "Пароль",
          adminLogin: "Вход администратора (superuser)",
          submit: "Войти",
          noAccount: "Ещё нет аккаунта?",
          register: "Зарегистрироваться",
          greeting: "Здравствуйте!",
          greetingName: "Здравствуйте, {name}!",
          roleAdmin:
            "Вы вошли как администратор: доступны панель администратора и проверка API.",
          roleUser: "Вы вошли как пользователь: доступен список AI-провайдеров.",
          adminBtn: "Панель администратора",
          apiBtn: "Проверить API",
          friend: "друг",
          adminSuffix: " (админ)",
          err401: "Неверный email или пароль, либо сессия истекла.",
          errAuth: "Неверный email или пароль.",
          errRequest: "Запрос не удался (HTTP {status}).",
          sessionExpired: "Сессия истекла, войдите заново.",
          errServer: "Не удалось получить данные с сервера: {message}",
          checking: "Проверяем…",
          checkHealthError: "/api/health → ошибка: {message}",
          checkMetaTitle: "/api/ai-config/meta:",
          checkCatalogCount: "  провайдеров в каталоге: {n}",
          checkProposalCount: "  предложений от пользователей: {n}",
          checkMyProposalCount: "  из них моих: {n}",
          checkCatalogueFile: "  файл каталога: {path}",
          checkExists: "  существует: {yesno}",
          checkDataDir: "  каталог данных: {path}",
          checkSuperuser: "  superuser: {yesno}",
          checkMetaError: "/api/ai-config/meta → ошибка: {message}",
          yes: "да",
          no: "нет",
        },
        en: {
          logout: "Sign out",
          loginTitle: "Sign in",
          email: "Email",
          password: "Password",
          adminLogin: "Administrator sign-in (superuser)",
          submit: "Sign in",
          noAccount: "No account yet?",
          register: "Register",
          greeting: "Hello!",
          greetingName: "Hello, {name}!",
          roleAdmin:
            "You are signed in as an administrator: the admin panel and the API check are available.",
          roleUser:
            "You are signed in as a user: the AI provider list is available.",
          adminBtn: "Admin panel",
          apiBtn: "Check API",
          friend: "friend",
          adminSuffix: " (admin)",
          err401: "Wrong email or password, or the session has expired.",
          errAuth: "Wrong email or password.",
          errRequest: "Request failed (HTTP {status}).",
          sessionExpired: "The session has expired, please sign in again.",
          errServer: "Could not load data from the server: {message}",
          checking: "Checking…",
          checkHealthError: "/api/health → error: {message}",
          checkMetaTitle: "/api/ai-config/meta:",
          checkCatalogCount: "  providers in the catalogue: {n}",
          checkProposalCount: "  user suggestions: {n}",
          checkMyProposalCount: "  of them mine: {n}",
          checkCatalogueFile: "  catalogue file: {path}",
          checkExists: "  exists: {yesno}",
          checkDataDir: "  data directory: {path}",
          checkSuperuser: "  superuser: {yesno}",
          checkMetaError: "/api/ai-config/meta → error: {message}",
          yes: "yes",
          no: "no",
        },
        de: {
          logout: "Abmelden",
          loginTitle: "Anmeldung",
          email: "E-Mail",
          password: "Passwort",
          adminLogin: "Administrator-Anmeldung (Superuser)",
          submit: "Anmelden",
          noAccount: "Noch kein Konto?",
          register: "Registrieren",
          greeting: "Hallo!",
          greetingName: "Hallo, {name}!",
          roleAdmin:
            "Sie sind als Administrator angemeldet: Admin-Panel und API-Prüfung sind verfügbar.",
          roleUser:
            "Sie sind als Benutzer angemeldet: die Liste der KI-Anbieter ist verfügbar.",
          adminBtn: "Admin-Panel",
          apiBtn: "API prüfen",
          friend: "Freund",
          adminSuffix: " (Admin)",
          err401:
            "Falsche E-Mail oder falsches Passwort oder die Sitzung ist abgelaufen.",
          errAuth: "Falsche E-Mail oder falsches Passwort.",
          errRequest: "Anfrage fehlgeschlagen (HTTP {status}).",
          sessionExpired: "Die Sitzung ist abgelaufen, bitte erneut anmelden.",
          errServer:
            "Daten konnten nicht vom Server geladen werden: {message}",
          checking: "Prüfe…",
          checkHealthError: "/api/health → Fehler: {message}",
          checkMetaTitle: "/api/ai-config/meta:",
          checkCatalogCount: "  Anbieter im Katalog: {n}",
          checkProposalCount: "  Vorschläge von Benutzern: {n}",
          checkMyProposalCount: "  davon meine: {n}",
          checkCatalogueFile: "  Katalogdatei: {path}",
          checkExists: "  vorhanden: {yesno}",
          checkDataDir: "  Datenverzeichnis: {path}",
          checkSuperuser: "  Superuser: {yesno}",
          checkMetaError: "/api/ai-config/meta → Fehler: {message}",
          yes: "ja",
          no: "nein",
        },
      };

      function t(key, vars) {
        var pack = STR[UI.lang] || STR.ru;
        var text = pack[key] !== undefined ? pack[key] : STR.ru[key];
        if (text === undefined) {
          text = key;
        }
        if (vars) {
          text = text.replace(/\{(\w+)\}/g, function (match, name) {
            return vars[name] !== undefined ? vars[name] : match;
          });
        }
        return text;
      }

      function applyI18n() {
        document.querySelectorAll("[data-i18n]").forEach(function (node) {
          node.textContent = t(node.getAttribute("data-i18n"));
        });
      }

      var state = {
        token: localStorage.getItem(TOKEN_KEY) || null,
        user: null,
        isSuperuser: false,
      };

      var el = {
        authView: document.getElementById("auth-view"),
        menuView: document.getElementById("menu-view"),
        topbarActions: document.getElementById("topbar-actions"),
        who: document.getElementById("who"),
        greeting: document.getElementById("greeting"),
        roleNote: document.getElementById("role-note"),
        authNote: document.getElementById("auth-note"),
        errorNote: document.getElementById("error-note"),
        loginForm: document.getElementById("login-form"),
        logoutBtn: document.getElementById("logout-btn"),
        adminLogin: document.getElementById("admin-login"),
        adminBtn: document.getElementById("admin-btn"),
        apiBtn: document.getElementById("api-btn"),
        apiOut: document.getElementById("api-out"),
      };

      function safeParse(raw) {
        try {
          return raw ? JSON.parse(raw) : null;
        } catch (err) {
          return null;
        }
      }

      state.user = safeParse(localStorage.getItem(USER_KEY));

      async function api(path, options) {
        var opts = options || {};
        var headers = {};
        if (opts.body !== undefined) {
          headers["Content-Type"] = "application/json";
        }
        if (opts.auth !== false && state.token) {
          headers["Authorization"] = state.token;
        }

        var res = await fetch(path, {
          method: opts.method || "GET",
          headers: headers,
          body: opts.body === undefined ? undefined : JSON.stringify(opts.body),
        });

        var text = await res.text();
        var data = null;
        if (text) {
          try {
            data = JSON.parse(text);
          } catch (err) {
            data = text;
          }
        }

        if (!res.ok) {
          var error = new Error(humanError(data, res.status));
          error.status = res.status;
          throw error;
        }

        return data;
      }

      function humanError(data, status) {
        if (status === 401) {
          return t("err401");
        }
        var raw =
          data && typeof data === "object" ? String(data.message || "") : "";
        if (raw.toLowerCase().indexOf("failed to authenticate") >= 0) {
          return t("errAuth");
        }
        return raw || t("errRequest", { status: status });
      }

      function setAuthNote(message) {
        el.authNote.hidden = !message;
        el.authNote.textContent = message || "";
      }

      function setError(message) {
        el.errorNote.hidden = !message;
        el.errorNote.textContent = message || "";
      }

      /* ------------------------------------------------------------------ */

      function render() {
        var loggedIn = !!state.token;

        el.authView.hidden = loggedIn;
        el.menuView.hidden = !loggedIn;
        el.topbarActions.hidden = !loggedIn;

        // Administrator actions exist only for a superuser.
        el.adminBtn.hidden = !state.isSuperuser;
        el.apiBtn.hidden = !state.isSuperuser;

        if (!loggedIn) {
          el.greeting.textContent = t("greeting");
          return;
        }

        var name =
          (state.user && (state.user.name || state.user.email)) || t("friend");
        el.who.textContent = name + (state.isSuperuser ? t("adminSuffix") : "");
        el.greeting.textContent = t("greetingName", { name: name });
        el.roleNote.textContent = state.isSuperuser
          ? t("roleAdmin")
          : t("roleUser");
      }

      async function doLogin(identity, password, isAdmin) {
        var collectionName = isAdmin ? "_superusers" : "users";

        var data = await api(
          "/api/collections/" + collectionName + "/auth-with-password",
          {
            method: "POST",
            auth: false,
            body: { identity: identity, password: password },
          },
        );

        var record = data.record || {};
        state.token = data.token;
        state.user = {
          name: record.name || record.email || "superuser",
          email: record.email || "",
          isAdmin: !!isAdmin,
        };
        state.isSuperuser = !!isAdmin;

        localStorage.setItem(TOKEN_KEY, data.token);
        localStorage.setItem(USER_KEY, JSON.stringify(state.user));
      }

      function doLogout() {
        state.token = null;
        state.user = null;
        state.isSuperuser = false;
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_KEY);
        el.apiOut.hidden = true;
        el.apiOut.textContent = "";
        render();
      }

      /// Re-reads the role from the server: it is the only side that knows
      /// whether the token belongs to a superuser.
      async function refreshRole() {
        try {
          var meta = await api("/api/ai-config/meta");
          state.isSuperuser = meta && meta.isSuperuser === true;
          setError("");
          render();
        } catch (err) {
          if (err.status === 401) {
            doLogout();
            setAuthNote(t("sessionExpired"));
            return;
          }
          setError(t("errServer", { message: err.message }));
        }
      }

      /// Health plus the catalogue diagnostics, for administrators only.
      async function checkApi() {
        el.apiOut.hidden = false;
        el.apiOut.textContent = t("checking");

        var lines = [];

        try {
          var health = await api("/api/health", { auth: false });
          lines.push("/api/health → " + JSON.stringify(health));
        } catch (err) {
          lines.push(t("checkHealthError", { message: err.message }));
        }

        try {
          var meta = await api("/api/ai-config/meta");
          lines.push("");
          lines.push(t("checkMetaTitle"));
          lines.push(t("checkCatalogCount", { n: meta.catalogueCount }));
          lines.push(t("checkProposalCount", { n: meta.proposalCount }));
          lines.push(t("checkMyProposalCount", { n: meta.myProposalCount }));
          lines.push(t("checkCatalogueFile", { path: meta.catalogue }));
          lines.push(
            t("checkExists", {
              yesno: meta.catalogueExists ? t("yes") : t("no"),
            }),
          );
          lines.push(t("checkDataDir", { path: meta.dir }));
          lines.push(
            t("checkSuperuser", {
              yesno: meta.isSuperuser ? t("yes") : t("no"),
            }),
          );
        } catch (err) {
          lines.push("");
          lines.push(t("checkMetaError", { message: err.message }));
        }

        el.apiOut.textContent = lines.join("\n");
      }

      el.loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        var form = event.target;
        setAuthNote("");
        try {
          await doLogin(
            form.identity.value.trim(),
            form.password.value,
            el.adminLogin.checked,
          );
          form.reset();
          render();
          refreshRole();
        } catch (err) {
          setAuthNote(err.message);
        }
      });

      el.logoutBtn.addEventListener("click", doLogout);
      el.apiBtn.addEventListener("click", checkApi);

      UI.onChange(function () {
        applyI18n();
        render();
      });

      UI.mount();
      applyI18n();
      render();

      if (state.token) {
        refreshRole();
      }
    </script>
  </body>
</html>
